name: Pheonix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule: # Set the CRON for midnight IST -----UTC
   - cron: "30 19 * * *"
   - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa,dev,uat]
        default: qa
        required: true

      suiteXmlFile:
        description: "TestNG XML File"
        type: choice
        options: [testng.xml,smoke.xml,sanity.xml]
        default: testng.xml
        required: true
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven
        
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile="${{ github.event.inputs.suiteXmlFile }}" -Denv="${{ github.event.inputs.env }}"

    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: SureFire Report
        path: target/surefire-reports/
        retention-days: 10
